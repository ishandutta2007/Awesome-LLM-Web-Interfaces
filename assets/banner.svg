<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".8"/></linearGradient><radialGradient id="meshSphere1" cx="30%" cy="20%" r="50%"><stop offset="0%" stop-color="#4f46e5" stop-opacity=".4"/><stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/></radialGradient><radialGradient id="meshSphere2" cx="80%" cy="80%" r="60%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".25"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient><pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".45" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#475569" fill-opacity=".3"/></pattern><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadowDepth" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".6" stdDeviation="12"/></filter></defs><style>@keyframes pulseOrb1{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(25px,-15px);opacity:.55}}@keyframes pulseOrb2{0%{transform:scale(1) translate(0,0);opacity:.25}50%{transform:scale(1.2) translate(-20px,20px);opacity:.45}}@keyframes dataFlow{0%{stroke-dashoffset:400}}@keyframes nodeBlink{0%{opacity:.3;transform:scale(.9)}50%{opacity:1;transform:scale(1.2)}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.font-sub,.font-title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.font-title{font-weight:800;letter-spacing:-1.5px}.font-sub{font-weight:500;letter-spacing:.5px}.font-tag{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,monospace;font-weight:600;font-size:13px}.dynamic-orb-1{animation:pulseOrb1 10s ease-in-out infinite;transform-origin:300px 100px}.dynamic-orb-2{animation:pulseOrb2 12s ease-in-out infinite;transform-origin:900px 300px}.flow-stream{stroke-dasharray:12 12;animation:dataFlow 14s linear infinite}.flow-stream-reverse{stroke-dasharray:10 14;animation:dataFlow 18s linear infinite reverse}.pulse-node-1{animation:nodeBlink 3s ease-in-out infinite;transform-origin:180px 120px}.pulse-node-2{animation:nodeBlink 4s ease-in-out infinite 1s;transform-origin:1020px 280px}.pulse-node-3{animation:nodeBlink 3.5s ease-in-out infinite 2s;transform-origin:960px 100px}.pill-float-1{animation:floatPill 5s ease-in-out infinite}.pill-float-2{animation:floatPill 6s ease-in-out infinite 1.5s}.pill-float-3{animation:floatPill 5.5s ease-in-out infinite .75s}</style><rect width="1200" height="400" fill="url(#bgGradient)" rx="16"/><circle cx="280" cy="110" r="260" fill="url(#meshSphere1)" class="dynamic-orb-1"/><circle cx="950" cy="300" r="300" fill="url(#meshSphere2)" class="dynamic-orb-2"/><rect width="1200" height="400" fill="url(#techGrid)" rx="16"/><g opacity=".35"><path fill="none" stroke="url(#primaryGlow)" stroke-width="2" d="M 0 140 Q 300 200 600 120 T 1200 160" class="flow-stream"/><path fill="none" stroke="url(#cyanPurple)" stroke-width="1.8" d="M 0 280 Q 400 190 800 310 T 1200 240" class="flow-stream-reverse"/><path fill="none" stroke="#6366f1" stroke-dasharray="6 8" stroke-width="1.2" d="M 150 0 C 220 180 320 220 400 400" class="flow-stream"/><path fill="none" stroke="#ec4899" stroke-dasharray="6 8" stroke-width="1.2" d="M 850 0 C 920 180 1020 220 1100 400" class="flow-stream-reverse"/></g><g class="pulse-node-1"><circle cx="180" cy="120" r="4" fill="#06b6d4" filter="url(#softGlow)"/><circle cx="180" cy="120" r="10" fill="none" stroke="#06b6d4" stroke-width="1" opacity=".4"/></g><g class="pulse-node-2"><circle cx="1020" cy="280" r="4.5" fill="#ec4899" filter="url(#softGlow)"/><circle cx="1020" cy="280" r="12" fill="none" stroke="#ec4899" stroke-width="1" opacity=".4"/></g><g class="pulse-node-3"><circle cx="960" cy="100" r="3.5" fill="#8b5cf6" filter="url(#softGlow)"/><circle cx="960" cy="100" r="9" fill="none" stroke="#8b5cf6" stroke-width="1" opacity=".4"/></g><g filter="url(#shadowDepth)"><g class="pill-float-1" transform="translate(600, 75)"><rect width="280" height="32" x="-140" y="-16" fill="#1e1b4b" stroke="#6366f1" stroke-opacity=".8" stroke-width="1.5" rx="16"/><circle cx="-115" cy="0" r="5" fill="#10b981"/><text x="-98" y="5" fill="#c7d2fe" class="font-tag" text-anchor="start">CURATED AWESOME ECOSYSTEM</text></g><text x="600" y="160" fill="#fff" class="font-title" filter="url(#softGlow)" font-size="52" text-anchor="middle">Awesome LLM Web Interfaces</text><text x="600" y="210" fill="#94a3b8" class="font-sub" font-size="19" text-anchor="middle">Top Self-Hosted Frontends, Multi-Provider Workspaces &amp; Model Runtimes</text><g><g class="pill-float-2" transform="translate(600, 280) translate(-320, 0)"><rect width="200" height="36" x="-100" y="-18" fill="#0f172a" stroke="#334155" stroke-width="1.2" rx="18"/><text x="0" y="5" fill="#38bdf8" class="font-tag" text-anchor="middle">🖥️ Local Inference</text></g><g class="pill-float-1" transform="translate(600, 280) translate(-105, 0)"><rect width="190" height="36" x="-95" y="-18" fill="#0f172a" stroke="#334155" stroke-width="1.2" rx="18"/><text x="0" y="5" fill="#a78bfa" class="font-tag" text-anchor