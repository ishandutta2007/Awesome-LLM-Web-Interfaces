<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="meshSphere1" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshSphere2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -1.5px;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .font-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-weight: 600;
      font-size: 13px;
    }

    /* Dynamic / Animated Aspects */
    @keyframes pulseOrb1 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-20px, 20px); opacity: 0.45; }
    }
    @keyframes dataFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .dynamic-orb-1 {
      animation: pulseOrb1 10s ease-in-out infinite;
      transform-origin: 300px 100px;
    }
    .dynamic-orb-2 {
      animation: pulseOrb2 12s ease-in-out infinite;
      transform-origin: 900px 300px;
    }
    .flow-stream {
      stroke-dasharray: 12 12;
      animation: dataFlow 14s linear infinite;
    }
    .flow-stream-reverse {
      stroke-dasharray: 10 14;
      animation: dataFlow 18s linear infinite reverse;
    }
    .pulse-node-1 { animation: nodeBlink 3s ease-in-out infinite; transform-origin: 180px 120px; }
    .pulse-node-2 { animation: nodeBlink 4s ease-in-out infinite 1s; transform-origin: 1020px 280px; }
    .pulse-node-3 { animation: nodeBlink 3.5s ease-in-out infinite 2s; transform-origin: 960px 100px; }
    .pill-float-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill 6s ease-in-out infinite 1.5s; }
    .pill-float-3 { animation: floatPill 5.5s ease-in-out infinite 0.75s; }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Dynamic Ambient Orbs (strictly in background) -->
  <circle cx="280" cy="110" r="260" fill="url(#meshSphere1)" class="dynamic-orb-1" />
  <circle cx="950" cy="300" r="300" fill="url(#meshSphere2)" class="dynamic-orb-2" />

  <!-- Grid Overlay -->
  <rect width="1200" height="400" fill="url(#techGrid)" rx="16" />

  <!-- Dynamic Animated Tech Flows / Circuit Lines (in background behind text) -->
  <g opacity="0.35">
    <path d="M 0 140 Q 300 200 600 120 T 1200 160" fill="none" stroke="url(#primaryGlow)" stroke-width="2" class="flow-stream" />
    <path d="M 0 280 Q 400 190 800 310 T 1200 240" fill="none" stroke="url(#cyanPurple)" stroke-width="1.8" class="flow-stream-reverse" />
    <path d="M 150 0 C 220 180 320 220 400 400" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="6 8" class="flow-stream" />
    <path d="M 850 0 C 920 180 1020 220 1100 400" fill="none" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="6 8" class="flow-stream-reverse" />
  </g>

  <!-- Animated Accent Data Nodes -->
  <g class="pulse-node-1">
    <circle cx="180" cy="120" r="4" fill="#06b6d4" filter="url(#softGlow)" />
    <circle cx="180" cy="120" r="10" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4" />
  </g>
  <g class="pulse-node-2">
    <circle cx="1020" cy="280" r="4.5" fill="#ec4899" filter="url(#softGlow)" />
    <circle cx="1020" cy="280" r="12" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.4" />
  </g>
  <g class="pulse-node-3">
    <circle cx="960" cy="100" r="3.5" fill="#8b5cf6" filter="url(#softGlow)" />
    <circle cx="960" cy="100" r="9" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Foreground Title Card / Content (Always on Top) -->
  <g filter="url(#shadowDepth)">
    <!-- Category Badge -->
    <g class="pill-float-1" transform="translate(600, 75)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.8" />
      <circle cx="-115" cy="0" r="5" fill="#10b981" />
      <text x="-98" y="5" fill="#c7d2fe" class="font-tag" text-anchor="start">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" class="font-title" font-size="52" fill="#ffffff" filter="url(#softGlow)">
      Awesome LLM Web Interfaces
    </text>

    <!-- Subtitle (Clear, readable, high contrast) -->
    <text x="600" y="210" text-anchor="middle" class="font-sub" font-size="19" fill="#94a3b8">
      Top Self-Hosted Frontends, Multi-Provider Workspaces &amp; Model Runtimes
    </text>

    <!-- Interactive / Highlighting Feature Badges (Floating softly, not obstructing text) -->
    <g transform="translate(600, 280)">
      <!-- Pill 1: Self-Hosted & Local -->
      <g class="pill-float-2" transform="translate(-320, 0)">
        <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" class="font-tag" fill="#38bdf8">🖥️ Local Inference</text>
      </g>

      <!-- Pill 2: Agentic & RAG -->
      <g class="pill-float-1" transform="translate(-105, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" class="font-tag" fill="#a78bfa">⚡ Agentic &amp; RAG</text>
      </g>

      <!-- Pill 3: Multi-Provider -->
      <g class="pill-float-3" transform="translate(105, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" class="font-tag" fill="#f472b6">🌐 Multi-Provider</text>
      </g>

      <!-- Pill 4: Open Source First -->
      <g class="pill-float-2" transform="translate(320, 0)">
        <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" class="font-tag" fill="#34d399">🔓 Open-Source First</text>
      </g>
    </g>

    <!-- Bottom Metric / Status Line -->
    <text x="600" y="352" text-anchor="middle" class="font-tag" font-size="13" fill="#64748b">
      ✨ 180K+ Stars Across Category Leaders • Updated October 2026 • Curated for Developers &amp; Teams
    </text>
  </g>
</svg>
